<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="320" viewBox="0 0 1060 320" role="img" aria-labelledby="title desc">
  <title id="title">Elemental destruction formula curves</title>
  <desc id="desc">Two line charts showing hurt as a function of damage and q cubed as a function of roll CDF percentile.</desc>
  <style>
    .bg { fill: #f7f1e3; }
    .panel { fill: #fffdf7; stroke: #d5c8aa; stroke-width: 1; }
    .grid { stroke: #e8dcc3; stroke-width: 1; }
    .axis { stroke: #54473f; stroke-width: 1.5; }
    .tick { fill: #54473f; font: 12px "Segoe UI", sans-serif; }
    .title { fill: #2f2925; font: 600 18px "Segoe UI", sans-serif; }
    .formula { fill: #6a5e54; font: 13px "Consolas", monospace; }
    .curve-hurt { fill: none; stroke: #d96c06; stroke-width: 3; }
    .curve-q { fill: none; stroke: #00798c; stroke-width: 3; }
    .guide { stroke: #b44f7b; stroke-width: 2; stroke-dasharray: 6 5; }
    .label { fill: #7a3551; font: 12px "Segoe UI", sans-serif; }
  </style>
  <rect class="bg" x="0" y="0" width="1060" height="320" />
  <rect class="panel" x="20" y="20" width="500" height="280" rx="10" />
  <rect class="panel" x="540" y="20" width="500" height="280" rx="10" />

  <text class="title" x="40" y="48">Hurt From Damage (x=80 baseline)</text>
  <text class="formula" x="40" y="68">hurt(d,x) = d^2 / (d^2 + (x/3)^2)</text>
  <text class="title" x="560" y="48">q² From Roll CDF</text>
  <text class="formula" x="560" y="68">q(cdf) = clamp01((cdf - 0.50) / 0.50), chance term = q²</text>

