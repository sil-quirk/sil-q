# sound.cfg
#
# Configuration file for the SDL sound system.
# Each sound event listed under [Sound] can have multiple samples separated by spaces.
# Samples inherit the default extension declared under [Audio] unless they explicitly
# include their own extension (e.g., "teleport.ogg").
#
# Audio settings (optional, defaults shown):
[Audio]
base_path = sound
extension = wav
sample_rate = 22050
channels = 2
format = s16

[AudioPaths]
path = sound/Minifantasy_Weapons_SFX/Hits
path = sound/Minifantasy_Weapons_SFX/Slash_Attacks
path = sound/Minifantasy_Weapons_SFX/Swing_Attacks
path = sound/Minifantasy_Weapons_SFX/Ranged_Attacks
path = sound/Minifantasy_Weapons_SFX/Thrust_Attacks
path = sound/Minifantasy_Weapons_SFX/Guard
path = sound/Minifantasy_Weapons_SFX/Charged_Attacks

# Event mappings. Event names match the values in angband_sound_name[].
[Sound]
hit = hit hit1
miss = miss miss1
flee = flee
drop = 
kill = 
level = level
death = death
study =
teleport =
shoot = bow-shot1 bow-shot2
quaff =
zap = Charge_1 Charge_2 Special_Attack_1 Special_Attack_2
walk =
tpother =
hitwall = hit Hit_Metal_on_wood
eat = eat
store1 =
store2 =
store3 =
store4 =
dig = thump Hit_Metal_on_stone Hit_Wood_on_stone Thrust_1 Thrust_2
opendoor = opendoor
shutdoor = shutdoor
tplevel = teleport
weapon_slash_light = Slash_Attack_Light_1 Slash_Attack_Light_2 Slash_Attack_Light_3 Slash_Attack_Sword_1 Slash_Attack_Sword_2 Slash_Attack_Sword_3 Whip_1 Whip_2
weapon_slash_heavy = Slash_Attack_Heavy_1 Slash_Attack_Heavy_2 Slash_Attack_Heavy_3 Hit_Metal_on_wood_heavy
weapon_thrust = Thrust_1 Thrust_2 Charge_1 Charge_2 Special_Attack_1 Special_Attack_2
weapon_blunt = Hit_Metal_on_wood Hit_Metal_on_wood_heavy Hit_Metal_on_metal Hit_Wood_on_wood Wooden_Shield_Light Wooden_Shield_Heavy Iron_shield_1 Iron_shield_2
weapon_unarmed = Hit_Wood_on_flesh Hit_Wood_on_leather Hit_Wood_on_metal Hit_Wood_on_stone
