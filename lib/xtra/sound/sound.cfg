# sound.cfg
#
# Configuration file for the SDL sound system.
# Each sound event listed under [Sound] can have multiple samples separated by spaces.
# Samples inherit the default extension declared under [Audio] unless they explicitly
# include their own extension (e.g., "teleport.ogg").
#
# Audio settings (optional, defaults shown):
[Audio]
base_path = sound
extension = wav
sample_rate = 22050
channels = 2
format = s16

[AudioPaths]
path = sound/Minifantasy_Weapons_SFX/Hits
path = sound/Minifantasy_Weapons_SFX/Slash_Attacks
path = sound/Minifantasy_Weapons_SFX/Swing_Attacks
path = sound/Minifantasy_Weapons_SFX/Ranged_Attacks
path = sound/Minifantasy_Weapons_SFX/Thrust_Attacks
path = sound/Minifantasy_Weapons_SFX/Guard
path = sound/Minifantasy_Weapons_SFX/Charged_Attacks

# Event mappings. Event names match the values in angband_sound_name[].
[Sound]
hit = hit hit1 Hit_Metal_on_flesh Hit_Metal_on_leather Hit_Metal_on_metal Hit_Metal_on_wood Hit_Wood_on_flesh Hit_Wood_on_leather Hit_Wood_on_metal Hit_Wood_on_wood Slash_Attack_Light_1 Slash_Attack_Light_2 Slash_Attack_Light_3 Slash_Attack_Sword_1 Slash_Attack_Sword_2 Slash_Attack_Sword_3 Swing_Attack_Heavy_1 Swing_Attack_Heavy_2 Flail_1 Flail_2 Whip_1 Whip_2
miss = miss miss1 
flee = flee
drop = #clunk
kill = 
level = level
death = death
study =
teleport =
shoot = Bow_Charge_1 Bow_Charge_2 Bow_Release Slingshot_Shot Slingshot_Stretch
quaff =
zap = Charge_1 Charge_2 Special_Attack_1 Special_Attack_2
walk =
tpother =
hitwall = Hit_Metal_on_stone Hit_Wood_on_stone
eat = eat
store1 =
store2 =
store3 =
store4 =
dig = thump Hit_Metal_on_stone Hit_Wood_on_stone Thrust_1 Thrust_2
opendoor = opendoor
shutdoor = shutdoor
tplevel = teleport

