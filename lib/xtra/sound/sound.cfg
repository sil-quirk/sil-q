# sound.cfg
#
# Configuration file for the SDL sound system.
# Each sound event listed under [Sound] can have multiple samples separated by spaces.
# Samples inherit the default extension declared under [Audio] unless they explicitly
# include their own extension (e.g., "teleport.ogg").
#
# Audio settings (optional, defaults shown):
[Audio]
base_path = sound
extension = wav
sample_rate = 22050
channels = 2
format = s16

[AudioPaths]
path = sound/Minifantasy_Weapons_SFX/Hits
path = sound/Minifantasy_Weapons_SFX/Slash_Attacks
path = sound/Minifantasy_Weapons_SFX/Swing_Attacks
path = sound/Minifantasy_Weapons_SFX/Ranged_Attacks
path = sound/Minifantasy_Weapons_SFX/Thrust_Attacks
path = sound/Minifantasy_Weapons_SFX/Guard
path = sound/Minifantasy_Weapons_SFX/Charged_Attacks
path = sound/SFX/Attacks/Sword_Attacks_Hits_and_Blocks
path = sound/SFX/Attacks/Bow_Attacks_Hits_and_Blocks
path = sound/SFX/Doors_Gates_and_Chests
path = sound/SFX/Chopping_and_Mining
path = sound/SFX/Spells
path = sound/SFX/Footsteps/Stone
path = sound/SFX/Torch
path = sound/RPG Sound Pack/inventory
path = sound/RPG Sound Pack/battle

# Event mappings. Event names match the values in angband_sound_name[].
[Sound]
